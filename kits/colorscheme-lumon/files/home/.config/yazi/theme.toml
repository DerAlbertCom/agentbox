[mgr]
cwd = { fg = "#b4e4f6", italic = true }
hovered = { bg = "#243d56" }
preview_hovered = { bg = "#243d56" }
find_keyword = { fg = "#16242d", bg = "#8bc9eb", bold = true }
find_position = { fg = "#d1eef8", bold = true }
marker_copied = { fg = "#5e95bc", bg = "#5e95bc" }
marker_cut = { fg = "#4d86b0", bg = "#4d86b0" }
marker_marked = { fg = "#8bc9eb", bg = "#8bc9eb" }
marker_selected = { fg = "#6fb8e3", bg = "#6fb8e3" }
count_copied = { fg = "#16242d", bg = "#5e95bc" }
count_cut = { fg = "#16242d", bg = "#4d86b0" }
count_selected = { fg = "#16242d", bg = "#6fb8e3" }
border_symbol = "│"
border_style = { fg = "#505d67" }

[tabs]
active = { fg = "#16242d", bg = "#8bc9eb", bold = true }
inactive = { fg = "#8bc9eb", bg = "#293740" }

[mode]
normal_main = { fg = "#16242d", bg = "#6fb8e3", bold = true }
normal_alt = { fg = "#6fb8e3", bg = "#293740" }
select_main = { fg = "#16242d", bg = "#8bc9eb", bold = true }
select_alt = { fg = "#8bc9eb", bg = "#293740" }
unset_main = { fg = "#16242d", bg = "#4d86b0", bold = true }
unset_alt = { fg = "#4d86b0", bg = "#293740" }

[status]
overall = { fg = "#d6e2ee", bg = "#222f39" }
progress_label = { fg = "#d6e2ee", bold = true }
progress_normal = { fg = "#6fb8e3", bg = "#293740" }
progress_error = { fg = "#4d86b0", bg = "#293740" }
perm_type = { fg = "#6fb8e3" }
perm_read = { fg = "#6fa4c9" }
perm_write = { fg = "#4d86b0" }
perm_exec = { fg = "#5e95bc" }
perm_sep = { fg = "#505d67" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#6fa4c9" },
	{ mime = "{audio,video}/*", fg = "#8bc9eb" },
	{ mime = "application/*zip", fg = "#4d86b0" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#4d86b0" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#b4e4f6" },
	{ name = "*", is = "orphan", bg = "#4d86b0" },
	{ name = "*", is = "exec", fg = "#5e95bc" },
	{ name = "*/", fg = "#6fb8e3" },
	{ name = "*", fg = "#d6e2ee" },
]
