# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Lumon color scheme
description: Lumon colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: lumon
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#d6e2ee,bg:-1,hl:#8bc9eb,fg+:#f2fcff,bg+:#243d56,hl+:#f2fcff
      --color=info:#8996a1,prompt:#b4e4f6,pointer:#8bc9eb,marker:#5e95bc
      --color=spinner:#8bc9eb,header:#6fa4c9,border:#505d67,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:lumon lumon
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Lumon color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
