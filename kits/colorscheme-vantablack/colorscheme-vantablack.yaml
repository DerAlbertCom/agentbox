# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Vantablack color scheme
description: Vantablack colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: vantablack
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#ffffff,bg:-1,hl:#8d8d8d,fg+:#ffffff,bg+:#1a1a1a,hl+:#8d8d8d
      --color=info:#999999,prompt:#b0b0b0,pointer:#9b9b9b,marker:#b6b6b6
      --color=spinner:#9b9b9b,header:#cecece,border:#4d4d4d,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:vantablack vantablack
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Vantablack color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
