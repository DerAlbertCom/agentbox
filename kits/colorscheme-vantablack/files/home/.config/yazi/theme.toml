[mgr]
cwd = { fg = "#b0b0b0", italic = true }
hovered = { bg = "#1a1a1a" }
preview_hovered = { bg = "#1a1a1a" }
find_keyword = { fg = "#000000", bg = "#b9b9b9", bold = true }
find_position = { fg = "#b0b0b0", bold = true }
marker_copied = { fg = "#b6b6b6", bg = "#b6b6b6" }
marker_cut = { fg = "#a4a4a4", bg = "#a4a4a4" }
marker_marked = { fg = "#9b9b9b", bg = "#9b9b9b" }
marker_selected = { fg = "#8d8d8d", bg = "#8d8d8d" }
count_copied = { fg = "#000000", bg = "#b6b6b6" }
count_cut = { fg = "#000000", bg = "#a4a4a4" }
count_selected = { fg = "#000000", bg = "#8d8d8d" }
border_symbol = "│"
border_style = { fg = "#4d4d4d" }

[tabs]
active = { fg = "#000000", bg = "#8d8d8d", bold = true }
inactive = { fg = "#8d8d8d", bg = "#1a1a1a" }

[mode]
normal_main = { fg = "#000000", bg = "#8d8d8d", bold = true }
normal_alt = { fg = "#8d8d8d", bg = "#1a1a1a" }
select_main = { fg = "#000000", bg = "#9b9b9b", bold = true }
select_alt = { fg = "#9b9b9b", bg = "#1a1a1a" }
unset_main = { fg = "#000000", bg = "#a4a4a4", bold = true }
unset_alt = { fg = "#a4a4a4", bg = "#1a1a1a" }

[status]
overall = { fg = "#ffffff", bg = "#0f0f0f" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#8d8d8d", bg = "#1a1a1a" }
progress_error = { fg = "#a4a4a4", bg = "#1a1a1a" }
perm_type = { fg = "#8d8d8d" }
perm_read = { fg = "#cecece" }
perm_write = { fg = "#a4a4a4" }
perm_exec = { fg = "#b6b6b6" }
perm_sep = { fg = "#4d4d4d" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#cecece" },
	{ mime = "{audio,video}/*", fg = "#9b9b9b" },
	{ mime = "application/*zip", fg = "#a4a4a4" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#a4a4a4" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#b0b0b0" },
	{ name = "*", is = "orphan", bg = "#a4a4a4" },
	{ name = "*", is = "exec", fg = "#b6b6b6" },
	{ name = "*/", fg = "#8d8d8d" },
	{ name = "*", fg = "#ffffff" },
]
