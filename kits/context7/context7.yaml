# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Context7
version: "1.2.0"
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: [mcp.context7.com]
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: context7
      phase: runtime
      apiKey:
        name: CONTEXT7_API_KEY
        proxyManaged: true
        inject:
          - domain: mcp.context7.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/agent-context@2
    config:
      content: Context7 works keyless with rate limits; its optional API key is proxy-managed.
