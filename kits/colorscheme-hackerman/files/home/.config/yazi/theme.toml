[mgr]
cwd = { fg = "#7cf8f7", italic = true }
hovered = { bg = "#1f253a" }
preview_hovered = { bg = "#1f253a" }
find_keyword = { fg = "#0B0C16", bg = "#50f7a3", bold = true }
find_position = { fg = "#d1fffe", bold = true }
marker_copied = { fg = "#4fe88f", bg = "#4fe88f" }
marker_cut = { fg = "#50f872", bg = "#50f872" }
marker_marked = { fg = "#86a7df", bg = "#86a7df" }
marker_selected = { fg = "#829dd4", bg = "#829dd4" }
count_copied = { fg = "#0B0C16", bg = "#4fe88f" }
count_cut = { fg = "#0B0C16", bg = "#50f872" }
count_selected = { fg = "#0B0C16", bg = "#829dd4" }
border_symbol = "│"
border_style = { fg = "#4a535c" }

[tabs]
active = { fg = "#0B0C16", bg = "#82FB9C", bold = true }
inactive = { fg = "#82FB9C", bg = "#20242d" }

[mode]
normal_main = { fg = "#0B0C16", bg = "#829dd4", bold = true }
normal_alt = { fg = "#829dd4", bg = "#20242d" }
select_main = { fg = "#0B0C16", bg = "#86a7df", bold = true }
select_alt = { fg = "#86a7df", bg = "#20242d" }
unset_main = { fg = "#0B0C16", bg = "#50f872", bold = true }
unset_alt = { fg = "#50f872", bg = "#20242d" }

[status]
overall = { fg = "#ddf7ff", bg = "#181a24" }
progress_label = { fg = "#ddf7ff", bold = true }
progress_normal = { fg = "#829dd4", bg = "#20242d" }
progress_error = { fg = "#50f872", bg = "#20242d" }
perm_type = { fg = "#829dd4" }
perm_read = { fg = "#50f7d4" }
perm_write = { fg = "#50f872" }
perm_exec = { fg = "#4fe88f" }
perm_sep = { fg = "#4a535c" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#50f7d4" },
	{ mime = "{audio,video}/*", fg = "#86a7df" },
	{ mime = "application/*zip", fg = "#50f872" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#50f872" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#7cf8f7" },
	{ name = "*", is = "orphan", bg = "#50f872" },
	{ name = "*", is = "exec", fg = "#4fe88f" },
	{ name = "*/", fg = "#829dd4" },
	{ name = "*", fg = "#ddf7ff" },
]
