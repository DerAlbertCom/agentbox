# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Ethereal color scheme
description: Ethereal colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: ethereal
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#ffcead,bg:-1,hl:#7d82d9,fg+:#ffcead,bg+:#252e56,hl+:#c2c4f0
      --color=info:#9b8074,prompt:#a3bfd1,pointer:#c89dc1,marker:#92a593
      --color=spinner:#c89dc1,header:#E9BB4F,border:#514649,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:ethereal ethereal
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Ethereal color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
