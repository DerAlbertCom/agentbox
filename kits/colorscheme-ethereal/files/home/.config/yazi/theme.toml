[mgr]
cwd = { fg = "#a3bfd1", italic = true }
hovered = { bg = "#252e56" }
preview_hovered = { bg = "#252e56" }
find_keyword = { fg = "#060B1E", bg = "#eb8b54", bold = true }
find_position = { fg = "#dfeaf0", bold = true }
marker_copied = { fg = "#92a593", bg = "#92a593" }
marker_cut = { fg = "#ED5B5A", bg = "#ED5B5A" }
marker_marked = { fg = "#c89dc1", bg = "#c89dc1" }
marker_selected = { fg = "#7d82d9", bg = "#7d82d9" }
count_copied = { fg = "#060B1E", bg = "#92a593" }
count_cut = { fg = "#060B1E", bg = "#ED5B5A" }
count_selected = { fg = "#060B1E", bg = "#7d82d9" }
border_symbol = "│"
border_style = { fg = "#514649" }

[tabs]
active = { fg = "#060B1E", bg = "#7d82d9", bold = true }
inactive = { fg = "#7d82d9", bg = "#1f1f2c" }

[mode]
normal_main = { fg = "#060B1E", bg = "#7d82d9", bold = true }
normal_alt = { fg = "#7d82d9", bg = "#1f1f2c" }
select_main = { fg = "#060B1E", bg = "#c89dc1", bold = true }
select_alt = { fg = "#c89dc1", bg = "#1f1f2c" }
unset_main = { fg = "#060B1E", bg = "#ED5B5A", bold = true }
unset_alt = { fg = "#ED5B5A", bg = "#1f1f2c" }

[status]
overall = { fg = "#ffcead", bg = "#151727" }
progress_label = { fg = "#ffcead", bold = true }
progress_normal = { fg = "#7d82d9", bg = "#1f1f2c" }
progress_error = { fg = "#ED5B5A", bg = "#1f1f2c" }
perm_type = { fg = "#7d82d9" }
perm_read = { fg = "#E9BB4F" }
perm_write = { fg = "#ED5B5A" }
perm_exec = { fg = "#92a593" }
perm_sep = { fg = "#514649" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#E9BB4F" },
	{ mime = "{audio,video}/*", fg = "#c89dc1" },
	{ mime = "application/*zip", fg = "#ED5B5A" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ED5B5A" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#a3bfd1" },
	{ name = "*", is = "orphan", bg = "#ED5B5A" },
	{ name = "*", is = "exec", fg = "#92a593" },
	{ name = "*/", fg = "#7d82d9" },
	{ name = "*", fg = "#ffcead" },
]
