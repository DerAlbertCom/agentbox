# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Everforest color scheme
description: Everforest colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: everforest
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#d3c6aa,bg:-1,hl:#7fbbb3,fg+:#d3c6aa,bg+:#3d484d,hl+:#7fbbb3
      --color=info:#918c7e,prompt:#83c092,pointer:#d699b6,marker:#a7c080
      --color=spinner:#d699b6,header:#dbbc7f,border:#5f615c,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:everforest everforest
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Everforest color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
