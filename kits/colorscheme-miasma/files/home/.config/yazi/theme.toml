[mgr]
cwd = { fg = "#c9a554", italic = true }
hovered = { bg = "#383838" }
preview_hovered = { bg = "#383838" }
find_keyword = { fg = "#222222", bg = "#8d6242", bold = true }
find_position = { fg = "#c9a554", bold = true }
marker_copied = { fg = "#5f875f", bg = "#5f875f" }
marker_cut = { fg = "#685742", bg = "#685742" }
marker_marked = { fg = "#bb7744", bg = "#bb7744" }
marker_selected = { fg = "#78824b", bg = "#78824b" }
count_copied = { fg = "#222222", bg = "#5f875f" }
count_cut = { fg = "#222222", bg = "#685742" }
count_selected = { fg = "#222222", bg = "#78824b" }
border_symbol = "│"
border_style = { fg = "#52524d" }

[tabs]
active = { fg = "#222222", bg = "#78824b", bold = true }
inactive = { fg = "#78824b", bg = "#323230" }

[mode]
normal_main = { fg = "#222222", bg = "#78824b", bold = true }
normal_alt = { fg = "#78824b", bg = "#323230" }
select_main = { fg = "#222222", bg = "#bb7744", bold = true }
select_alt = { fg = "#bb7744", bg = "#323230" }
unset_main = { fg = "#222222", bg = "#685742", bold = true }
unset_alt = { fg = "#685742", bg = "#323230" }

[status]
overall = { fg = "#c2c2b0", bg = "#2c2c2b" }
progress_label = { fg = "#c2c2b0", bold = true }
progress_normal = { fg = "#78824b", bg = "#323230" }
progress_error = { fg = "#685742", bg = "#323230" }
perm_type = { fg = "#78824b" }
perm_read = { fg = "#b36d43" }
perm_write = { fg = "#685742" }
perm_exec = { fg = "#5f875f" }
perm_sep = { fg = "#52524d" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#b36d43" },
	{ mime = "{audio,video}/*", fg = "#bb7744" },
	{ mime = "application/*zip", fg = "#685742" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#685742" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#c9a554" },
	{ name = "*", is = "orphan", bg = "#685742" },
	{ name = "*", is = "exec", fg = "#5f875f" },
	{ name = "*/", fg = "#78824b" },
	{ name = "*", fg = "#c2c2b0" },
]
