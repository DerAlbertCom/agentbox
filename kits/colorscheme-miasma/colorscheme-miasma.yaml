# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Miasma color scheme
description: Miasma colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: miasma
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#c2c2b0,bg:-1,hl:#78824b,fg+:#c2c2b0,bg+:#383838,hl+:#78824b
      --color=info:#828277,prompt:#c9a554,pointer:#bb7744,marker:#5f875f
      --color=spinner:#bb7744,header:#b36d43,border:#52524d,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:miasma miasma
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Miasma color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
