# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Kanagawa color scheme
description: Kanagawa colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: kanagawa
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#dcd7ba,bg:-1,hl:#dcd7ba,fg+:#dcd7ba,bg+:#363646,hl+:#7fb4ca
      --color=info:#908d80,prompt:#6a9589,pointer:#957fb8,marker:#76946a
      --color=spinner:#957fb8,header:#c0a36e,border:#585654,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:kanagawa kanagawa
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Kanagawa color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
