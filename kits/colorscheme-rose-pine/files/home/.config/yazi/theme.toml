[mgr]
cwd = { fg = "#d7827e", italic = true }
hovered = { bg = "#dfdad9" }
preview_hovered = { bg = "#dfdad9" }
find_keyword = { fg = "#faf4ed", bg = "#cf8057", bold = true }
find_position = { fg = "#d7827e", bold = true }
marker_copied = { fg = "#286983", bg = "#286983" }
marker_cut = { fg = "#b4637a", bg = "#b4637a" }
marker_marked = { fg = "#907aa9", bg = "#907aa9" }
marker_selected = { fg = "#56949f", bg = "#56949f" }
count_copied = { fg = "#faf4ed", bg = "#286983" }
count_cut = { fg = "#faf4ed", bg = "#b4637a" }
count_selected = { fg = "#faf4ed", bg = "#56949f" }
border_symbol = "│"
border_style = { fg = "#c9c3ca" }

[tabs]
active = { fg = "#faf4ed", bg = "#56949f", bold = true }
inactive = { fg = "#56949f", bg = "#eae4e1" }

[mode]
normal_main = { fg = "#faf4ed", bg = "#56949f", bold = true }
normal_alt = { fg = "#56949f", bg = "#eae4e1" }
select_main = { fg = "#faf4ed", bg = "#907aa9", bold = true }
select_alt = { fg = "#907aa9", bg = "#eae4e1" }
unset_main = { fg = "#faf4ed", bg = "#b4637a", bold = true }
unset_alt = { fg = "#b4637a", bg = "#eae4e1" }

[status]
overall = { fg = "#575279", bg = "#f0eae6" }
progress_label = { fg = "#575279", bold = true }
progress_normal = { fg = "#56949f", bg = "#eae4e1" }
progress_error = { fg = "#b4637a", bg = "#eae4e1" }
perm_type = { fg = "#56949f" }
perm_read = { fg = "#ea9d34" }
perm_write = { fg = "#b4637a" }
perm_exec = { fg = "#286983" }
perm_sep = { fg = "#c9c3ca" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#ea9d34" },
	{ mime = "{audio,video}/*", fg = "#907aa9" },
	{ mime = "application/*zip", fg = "#b4637a" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#b4637a" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#d7827e" },
	{ name = "*", is = "orphan", bg = "#b4637a" },
	{ name = "*", is = "exec", fg = "#286983" },
	{ name = "*/", fg = "#56949f" },
	{ name = "*", fg = "#575279" },
]
