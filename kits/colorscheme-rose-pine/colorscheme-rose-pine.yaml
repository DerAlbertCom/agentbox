# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Rosé Pine color scheme
description: Rosé Pine colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: rose-pine
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#575279,bg:-1,hl:#56949f,fg+:#575279,bg+:#dfdad9,hl+:#56949f
      --color=info:#9893a7,prompt:#d7827e,pointer:#907aa9,marker:#286983
      --color=spinner:#907aa9,header:#ea9d34,border:#c9c3ca,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:rose-pine rose-pine
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Rosé Pine color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
