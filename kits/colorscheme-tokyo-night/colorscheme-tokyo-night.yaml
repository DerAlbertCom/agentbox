# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Tokyo Night color scheme
description: Tokyo Night colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: tokyonight_night
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#a9b1d6,bg:-1,hl:#7aa2f7,fg+:#c0caf5,bg+:#292e42,hl+:#7da6ff
      --color=info:#565f89,prompt:#0db9d7,pointer:#bb9af7,marker:#9ece6a
      --color=spinner:#bb9af7,header:#e0af68,border:#414868,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme-tokyo-night/install.sh
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Tokyo Night color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
