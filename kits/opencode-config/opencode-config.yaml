# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: opencode configuration
description: The guidance and the configuration the opencode agent reads in the sandbox.
version: "1.0.0"

capabilities:
  # opencode reads its guidance next to its own configuration.
  - type: com.docker.sandbox/agent-context@2
    config:
      directory: /home/agent/.config/opencode
      filename: AGENTS.md
      content: |
        You work in a sandbox that has its own tools. The runtime's `WORKSPACE_DIR`
        environment variable identifies the folder you were started for. Before
        working on the project, enter that directory:

        ```sh
        cd -- "$WORKSPACE_DIR"
        ```

        Use this runtime path rather than the image's default working directory.

        Conventions for work in this sandbox:

        - Service credentials managed by the sandbox proxy stay on the host. Use the
          sandbox tools' proxy-backed access rather than searching for tokens.
        - Explicitly selected .NET User Secrets may have been copied into runtime
          files for applications. Treat these files as sensitive and keep their
          values out of output; they are separate from host proxy credentials.
        - Your session state lives in ~/.config/opencode/state, which is kept when the
          sandbox is replaced.
