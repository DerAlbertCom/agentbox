# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Starship color scheme
description: Starship colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: starship
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#f5f5f7,bg:-1,hl:#ff9f0a,fg+:#ffffff,bg+:#3a3a3c,hl+:#b5d0ea
      --color=info:#9e9ea0,prompt:#a6dcef,pointer:#ff8fa3,marker:#ff9f0a
      --color=spinner:#ff8fa3,header:#ffc27a,border:#5d5d5f,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:starship starship
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Starship color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
