[mgr]
cwd = { fg = "#a6dcef", italic = true }
hovered = { bg = "#3a3a3c" }
preview_hovered = { bg = "#3a3a3c" }
find_keyword = { fg = "#1c1c1e", bg = "#ff6a3d", bold = true }
find_position = { fg = "#cdeefa", bold = true }
marker_copied = { fg = "#ff9f0a", bg = "#ff9f0a" }
marker_cut = { fg = "#ff5f4a", bg = "#ff5f4a" }
marker_marked = { fg = "#ff8fa3", bg = "#ff8fa3" }
marker_selected = { fg = "#8fb8de", bg = "#8fb8de" }
count_copied = { fg = "#1c1c1e", bg = "#ff9f0a" }
count_cut = { fg = "#1c1c1e", bg = "#ff5f4a" }
count_selected = { fg = "#1c1c1e", bg = "#8fb8de" }
border_symbol = "│"
border_style = { fg = "#5d5d5f" }

[tabs]
active = { fg = "#1c1c1e", bg = "#ff9f0a", bold = true }
inactive = { fg = "#ff9f0a", bg = "#323234" }

[mode]
normal_main = { fg = "#1c1c1e", bg = "#8fb8de", bold = true }
normal_alt = { fg = "#8fb8de", bg = "#323234" }
select_main = { fg = "#1c1c1e", bg = "#ff8fa3", bold = true }
select_alt = { fg = "#ff8fa3", bg = "#323234" }
unset_main = { fg = "#1c1c1e", bg = "#ff5f4a", bold = true }
unset_alt = { fg = "#ff5f4a", bg = "#323234" }

[status]
overall = { fg = "#f5f5f7", bg = "#29292b" }
progress_label = { fg = "#f5f5f7", bold = true }
progress_normal = { fg = "#8fb8de", bg = "#323234" }
progress_error = { fg = "#ff5f4a", bg = "#323234" }
perm_type = { fg = "#8fb8de" }
perm_read = { fg = "#ffc27a" }
perm_write = { fg = "#ff5f4a" }
perm_exec = { fg = "#ff9f0a" }
perm_sep = { fg = "#5d5d5f" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#ffc27a" },
	{ mime = "{audio,video}/*", fg = "#ff8fa3" },
	{ mime = "application/*zip", fg = "#ff5f4a" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ff5f4a" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#a6dcef" },
	{ name = "*", is = "orphan", bg = "#ff5f4a" },
	{ name = "*", is = "exec", fg = "#ff9f0a" },
	{ name = "*/", fg = "#8fb8de" },
	{ name = "*", fg = "#f5f5f7" },
]
