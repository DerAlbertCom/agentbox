# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Ristretto color scheme
description: Ristretto colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: ristretto
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#e6d9db,bg:-1,hl:#f38d70,fg+:#e6d9db,bg+:#403e41,hl+:#f8a788
      --color=info:#9c9192,prompt:#85dacc,pointer:#a8a9eb,marker:#adda78
      --color=spinner:#a8a9eb,header:#f9cc6c,border:#645b5c,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:ristretto ristretto
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Ristretto color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
