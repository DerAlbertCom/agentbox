# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: White color scheme
description: White colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: white
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#000000,bg:-1,hl:#6e6e6e,fg+:#000000,bg+:#c0c0c0,hl+:#1a1a1a
      --color=info:#666666,prompt:#3e3e3e,pointer:#2e2e2e,marker:#3a3a3a
      --color=spinner:#2e2e2e,header:#4a4a4a,border:#b3b3b3,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:white white
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the White color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
