[mgr]
cwd = { fg = "#3e3e3e", italic = true }
hovered = { bg = "#c0c0c0" }
preview_hovered = { bg = "#c0c0c0" }
find_keyword = { fg = "#ffffff", bg = "#4a4a4a", bold = true }
find_position = { fg = "#3e3e3e", bold = true }
marker_copied = { fg = "#3a3a3a", bg = "#3a3a3a" }
marker_cut = { fg = "#2a2a2a", bg = "#2a2a2a" }
marker_marked = { fg = "#2e2e2e", bg = "#2e2e2e" }
marker_selected = { fg = "#1a1a1a", bg = "#1a1a1a" }
count_copied = { fg = "#ffffff", bg = "#3a3a3a" }
count_cut = { fg = "#ffffff", bg = "#2a2a2a" }
count_selected = { fg = "#ffffff", bg = "#1a1a1a" }
border_symbol = "│"
border_style = { fg = "#b3b3b3" }

[tabs]
active = { fg = "#ffffff", bg = "#6e6e6e", bold = true }
inactive = { fg = "#6e6e6e", bg = "#e6e6e6" }

[mode]
normal_main = { fg = "#ffffff", bg = "#1a1a1a", bold = true }
normal_alt = { fg = "#1a1a1a", bg = "#e6e6e6" }
select_main = { fg = "#ffffff", bg = "#2e2e2e", bold = true }
select_alt = { fg = "#2e2e2e", bg = "#e6e6e6" }
unset_main = { fg = "#ffffff", bg = "#2a2a2a", bold = true }
unset_alt = { fg = "#2a2a2a", bg = "#e6e6e6" }

[status]
overall = { fg = "#000000", bg = "#f0f0f0" }
progress_label = { fg = "#000000", bold = true }
progress_normal = { fg = "#1a1a1a", bg = "#e6e6e6" }
progress_error = { fg = "#2a2a2a", bg = "#e6e6e6" }
perm_type = { fg = "#1a1a1a" }
perm_read = { fg = "#4a4a4a" }
perm_write = { fg = "#2a2a2a" }
perm_exec = { fg = "#3a3a3a" }
perm_sep = { fg = "#b3b3b3" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#4a4a4a" },
	{ mime = "{audio,video}/*", fg = "#2e2e2e" },
	{ mime = "application/*zip", fg = "#2a2a2a" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#2a2a2a" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#3e3e3e" },
	{ name = "*", is = "orphan", bg = "#2a2a2a" },
	{ name = "*", is = "exec", fg = "#3a3a3a" },
	{ name = "*/", fg = "#1a1a1a" },
	{ name = "*", fg = "#000000" },
]
