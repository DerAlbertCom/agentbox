# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: CAPE database MCP
version: "1.0.0"
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: [dev.cape.rwe.com]
  - type: com.docker.sandbox/credential@1
    config:
      service: cape-database-mcp
      phase: runtime
      apiKey:
        name: CAPE_DATABASE_MCP_API_KEY
        proxyManaged: true
        inject:
          - domain: dev.cape.rwe.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        database is https://dev.cape.rwe.com/mcp. Authentication is injected
        by the proxy; never save its API key in agent configuration.
