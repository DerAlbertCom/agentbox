[mgr]
cwd = { fg = "#86c7c5", italic = true }
hovered = { bg = "#2b5147" }
preview_hovered = { bg = "#2b5147" }
find_keyword = { fg = "#142620", bg = "#d2ab8d", bold = true }
find_position = { fg = "#a2dcda", bold = true }
marker_copied = { fg = "#8bcbb1", bg = "#8bcbb1" }
marker_cut = { fg = "#d88d91", bg = "#d88d91" }
marker_marked = { fg = "#b7a1c8", bg = "#b7a1c8" }
marker_selected = { fg = "#96b7d0", bg = "#96b7d0" }
count_copied = { fg = "#142620", bg = "#8bcbb1" }
count_cut = { fg = "#142620", bg = "#d88d91" }
count_selected = { fg = "#142620", bg = "#96b7d0" }
border_symbol = "│"
border_style = { fg = "#51625b" }

[tabs]
active = { fg = "#142620", bg = "#8bcbb1", bold = true }
inactive = { fg = "#8bcbb1", bg = "#283a34" }

[mode]
normal_main = { fg = "#142620", bg = "#96b7d0", bold = true }
normal_alt = { fg = "#96b7d0", bg = "#283a34" }
select_main = { fg = "#142620", bg = "#b7a1c8", bold = true }
select_alt = { fg = "#b7a1c8", bg = "#283a34" }
unset_main = { fg = "#142620", bg = "#d88d91", bold = true }
unset_alt = { fg = "#d88d91", bg = "#283a34" }

[status]
overall = { fg = "#dfede5", bg = "#20322c" }
progress_label = { fg = "#dfede5", bold = true }
progress_normal = { fg = "#96b7d0", bg = "#283a34" }
progress_error = { fg = "#d88d91", bg = "#283a34" }
perm_type = { fg = "#96b7d0" }
perm_read = { fg = "#c5cc91" }
perm_write = { fg = "#d88d91" }
perm_exec = { fg = "#8bcbb1" }
perm_sep = { fg = "#51625b" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#c5cc91" },
	{ mime = "{audio,video}/*", fg = "#b7a1c8" },
	{ mime = "application/*zip", fg = "#d88d91" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#d88d91" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#86c7c5" },
	{ name = "*", is = "orphan", bg = "#d88d91" },
	{ name = "*", is = "exec", fg = "#8bcbb1" },
	{ name = "*/", fg = "#96b7d0" },
	{ name = "*", fg = "#dfede5" },
]
