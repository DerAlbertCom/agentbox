# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Jade Horse color scheme
description: Jade Horse colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: jade-horse
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#dfede5,bg:-1,hl:#8bcbb1,fg+:#f0faf4,bg+:#2b5147,hl+:#b0cde3
      --color=info:#8e9d96,prompt:#86c7c5,pointer:#b7a1c8,marker:#8bcbb1
      --color=spinner:#b7a1c8,header:#c5cc91,border:#51625b,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:jade-horse jade-horse
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Jade Horse color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
