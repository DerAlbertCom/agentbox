[mgr]
cwd = { fg = "#94e2d5", italic = true }
hovered = { bg = "#45475a" }
preview_hovered = { bg = "#45475a" }
find_keyword = { fg = "#1e1e2e", bg = "#f6b6ab", bold = true }
find_position = { fg = "#94e2d5", bold = true }
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#f5c2e7", bg = "#f5c2e7" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }
count_copied = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#89b4fa" }
border_symbol = "│"
border_style = { fg = "#535569" }

[tabs]
active = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
inactive = { fg = "#89b4fa", bg = "#303042" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
normal_alt = { fg = "#89b4fa", bg = "#303042" }
select_main = { fg = "#1e1e2e", bg = "#f5c2e7", bold = true }
select_alt = { fg = "#f5c2e7", bg = "#303042" }
unset_main = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
unset_alt = { fg = "#f38ba8", bg = "#303042" }

[status]
overall = { fg = "#cdd6f4", bg = "#29293a" }
progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#303042" }
progress_error = { fg = "#f38ba8", bg = "#303042" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }
perm_sep = { fg = "#535569" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#f9e2af" },
	{ mime = "{audio,video}/*", fg = "#f5c2e7" },
	{ mime = "application/*zip", fg = "#f38ba8" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f38ba8" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#94e2d5" },
	{ name = "*", is = "orphan", bg = "#f38ba8" },
	{ name = "*", is = "exec", fg = "#a6e3a1" },
	{ name = "*/", fg = "#89b4fa" },
	{ name = "*", fg = "#cdd6f4" },
]
