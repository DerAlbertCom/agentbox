# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Catppuccin color scheme
description: Catppuccin colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: catppuccin
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#cdd6f4,bg:-1,hl:#89b4fa,fg+:#cdd6f4,bg+:#45475a,hl+:#89b4fa
      --color=info:#878ca5,prompt:#94e2d5,pointer:#f5c2e7,marker:#a6e3a1
      --color=spinner:#f5c2e7,header:#f9e2af,border:#535569,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:catppuccin catppuccin
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Catppuccin color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
