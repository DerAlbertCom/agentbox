[mgr]
cwd = { fg = "#bebebe", italic = true }
hovered = { bg = "#2a2a2a" }
preview_hovered = { bg = "#2a2a2a" }
find_keyword = { fg = "#121212", bg = "#c63d3d", bold = true }
find_position = { fg = "#eaeaea", bold = true }
marker_copied = { fg = "#FFC107", bg = "#FFC107" }
marker_cut = { fg = "#D35F5F", bg = "#D35F5F" }
marker_marked = { fg = "#D35F5F", bg = "#D35F5F" }
marker_selected = { fg = "#e68e0d", bg = "#e68e0d" }
count_copied = { fg = "#121212", bg = "#FFC107" }
count_cut = { fg = "#121212", bg = "#D35F5F" }
count_selected = { fg = "#121212", bg = "#e68e0d" }
border_symbol = "│"
border_style = { fg = "#464646" }

[tabs]
active = { fg = "#121212", bg = "#e68e0d", bold = true }
inactive = { fg = "#e68e0d", bg = "#232323" }

[mode]
normal_main = { fg = "#121212", bg = "#e68e0d", bold = true }
normal_alt = { fg = "#e68e0d", bg = "#232323" }
select_main = { fg = "#121212", bg = "#D35F5F", bold = true }
select_alt = { fg = "#D35F5F", bg = "#232323" }
unset_main = { fg = "#121212", bg = "#D35F5F", bold = true }
unset_alt = { fg = "#D35F5F", bg = "#232323" }

[status]
overall = { fg = "#bebebe", bg = "#1c1c1c" }
progress_label = { fg = "#bebebe", bold = true }
progress_normal = { fg = "#e68e0d", bg = "#232323" }
progress_error = { fg = "#D35F5F", bg = "#232323" }
perm_type = { fg = "#e68e0d" }
perm_read = { fg = "#b91c1c" }
perm_write = { fg = "#D35F5F" }
perm_exec = { fg = "#FFC107" }
perm_sep = { fg = "#464646" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#b91c1c" },
	{ mime = "{audio,video}/*", fg = "#D35F5F" },
	{ mime = "application/*zip", fg = "#D35F5F" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#D35F5F" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#bebebe" },
	{ name = "*", is = "orphan", bg = "#D35F5F" },
	{ name = "*", is = "exec", fg = "#FFC107" },
	{ name = "*/", fg = "#e68e0d" },
	{ name = "*", fg = "#bebebe" },
]
