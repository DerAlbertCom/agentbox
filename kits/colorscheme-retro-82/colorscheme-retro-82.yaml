# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Retro 82 color scheme
description: Retro 82 colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: retro-82
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#f6dcac,bg:-1,hl:#faa968,fg+:#f6dcac,bg+:#134e5a,hl+:#faa968
      --color=info:#968e7a,prompt:#8cbfb8,pointer:#3f8f8a,marker:#028391
      --color=spinner:#3f8f8a,header:#e97b3c,border:#4d5354,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:retro-82 retro-82
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Retro 82 color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
