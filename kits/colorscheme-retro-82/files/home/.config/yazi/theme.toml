[mgr]
cwd = { fg = "#8cbfb8", italic = true }
hovered = { bg = "#134e5a" }
preview_hovered = { bg = "#134e5a" }
find_keyword = { fg = "#05182e", bg = "#faa968", bold = true }
find_position = { fg = "#8cbfb8", bold = true }
marker_copied = { fg = "#028391", bg = "#028391" }
marker_cut = { fg = "#f85525", bg = "#f85525" }
marker_marked = { fg = "#3f8f8a", bg = "#3f8f8a" }
marker_selected = { fg = "#3f8f8a", bg = "#3f8f8a" }
count_copied = { fg = "#05182e", bg = "#028391" }
count_cut = { fg = "#05182e", bg = "#f85525" }
count_selected = { fg = "#05182e", bg = "#3f8f8a" }
border_symbol = "│"
border_style = { fg = "#4d5354" }

[tabs]
active = { fg = "#05182e", bg = "#faa968", bold = true }
inactive = { fg = "#faa968", bg = "#1d2c3b" }

[mode]
normal_main = { fg = "#05182e", bg = "#3f8f8a", bold = true }
normal_alt = { fg = "#3f8f8a", bg = "#1d2c3b" }
select_main = { fg = "#05182e", bg = "#3f8f8a", bold = true }
select_alt = { fg = "#3f8f8a", bg = "#1d2c3b" }
unset_main = { fg = "#05182e", bg = "#f85525", bold = true }
unset_alt = { fg = "#f85525", bg = "#1d2c3b" }

[status]
overall = { fg = "#f6dcac", bg = "#132436" }
progress_label = { fg = "#f6dcac", bold = true }
progress_normal = { fg = "#3f8f8a", bg = "#1d2c3b" }
progress_error = { fg = "#f85525", bg = "#1d2c3b" }
perm_type = { fg = "#3f8f8a" }
perm_read = { fg = "#e97b3c" }
perm_write = { fg = "#f85525" }
perm_exec = { fg = "#028391" }
perm_sep = { fg = "#4d5354" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#e97b3c" },
	{ mime = "{audio,video}/*", fg = "#3f8f8a" },
	{ mime = "application/*zip", fg = "#f85525" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f85525" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#8cbfb8" },
	{ name = "*", is = "orphan", bg = "#f85525" },
	{ name = "*", is = "exec", fg = "#028391" },
	{ name = "*/", fg = "#3f8f8a" },
	{ name = "*", fg = "#f6dcac" },
]
