[mgr]
cwd = { fg = "#a5a0b6", italic = true }
hovered = { bg = "#584e51" }
preview_hovered = { bg = "#584e51" }
find_keyword = { fg = "#0c0b0c", bg = "#6B5E73", bold = true }
find_position = { fg = "#a5a0b6", bold = true }
marker_copied = { fg = "#87a9b0", bg = "#87a9b0" }
marker_cut = { fg = "#c38b7b", bg = "#c38b7b" }
marker_marked = { fg = "#c4d8e2", bg = "#c4d8e2" }
marker_selected = { fg = "#b59790", bg = "#b59790" }
count_copied = { fg = "#0c0b0c", bg = "#87a9b0" }
count_cut = { fg = "#0c0b0c", bg = "#c38b7b" }
count_selected = { fg = "#0c0b0c", bg = "#b59790" }
border_symbol = "│"
border_style = { fg = "#535354" }

[tabs]
active = { fg = "#0c0b0c", bg = "#b59790", bold = true }
inactive = { fg = "#b59790", bg = "#242324" }

[mode]
normal_main = { fg = "#0c0b0c", bg = "#b59790", bold = true }
normal_alt = { fg = "#b59790", bg = "#242324" }
select_main = { fg = "#0c0b0c", bg = "#c4d8e2", bold = true }
select_alt = { fg = "#c4d8e2", bg = "#242324" }
unset_main = { fg = "#0c0b0c", bg = "#c38b7b", bold = true }
unset_alt = { fg = "#c38b7b", bg = "#242324" }

[status]
overall = { fg = "#FAFCFB", bg = "#1a191a" }
progress_label = { fg = "#FAFCFB", bold = true }
progress_normal = { fg = "#b59790", bg = "#242324" }
progress_error = { fg = "#c38b7b", bg = "#242324" }
perm_type = { fg = "#b59790" }
perm_read = { fg = "#6B5E73" }
perm_write = { fg = "#c38b7b" }
perm_exec = { fg = "#87a9b0" }
perm_sep = { fg = "#535354" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#6B5E73" },
	{ mime = "{audio,video}/*", fg = "#c4d8e2" },
	{ mime = "application/*zip", fg = "#c38b7b" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#c38b7b" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#a5a0b6" },
	{ name = "*", is = "orphan", bg = "#c38b7b" },
	{ name = "*", is = "exec", fg = "#87a9b0" },
	{ name = "*/", fg = "#b59790" },
	{ name = "*", fg = "#FAFCFB" },
]
