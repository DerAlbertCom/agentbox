[mgr]
cwd = { fg = "#0c67de", italic = true }
hovered = { bg = "#d0d0d0" }
preview_hovered = { bg = "#d0d0d0" }
find_keyword = { fg = "#fafafa", bg = "#026fde", bold = true }
find_position = { fg = "#3986ff", bold = true }
marker_copied = { fg = "#4a2fd0", bg = "#4a2fd0" }
marker_cut = { fg = "#c900c4", bg = "#c900c4" }
marker_marked = { fg = "#8a4ad7", bg = "#8a4ad7" }
marker_selected = { fg = "#3264eb", bg = "#3264eb" }
count_copied = { fg = "#fafafa", bg = "#4a2fd0" }
count_cut = { fg = "#fafafa", bg = "#c900c4" }
count_selected = { fg = "#fafafa", bg = "#3264eb" }
border_symbol = "│"
border_style = { fg = "#b9b9b9" }

[tabs]
active = { fg = "#fafafa", bg = "#3264eb", bold = true }
inactive = { fg = "#3264eb", bg = "#e4e4e4" }

[mode]
normal_main = { fg = "#fafafa", bg = "#3264eb", bold = true }
normal_alt = { fg = "#3264eb", bg = "#e4e4e4" }
select_main = { fg = "#fafafa", bg = "#8a4ad7", bold = true }
select_alt = { fg = "#8a4ad7", bg = "#e4e4e4" }
unset_main = { fg = "#fafafa", bg = "#c900c4", bold = true }
unset_alt = { fg = "#c900c4", bg = "#e4e4e4" }

[status]
overall = { fg = "#212121", bg = "#ededed" }
progress_label = { fg = "#212121", bold = true }
progress_normal = { fg = "#3264eb", bg = "#e4e4e4" }
progress_error = { fg = "#c900c4", bg = "#e4e4e4" }
perm_type = { fg = "#3264eb" }
perm_read = { fg = "#026fde" }
perm_write = { fg = "#c900c4" }
perm_exec = { fg = "#4a2fd0" }
perm_sep = { fg = "#b9b9b9" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#026fde" },
	{ mime = "{audio,video}/*", fg = "#8a4ad7" },
	{ mime = "application/*zip", fg = "#c900c4" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#c900c4" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#0c67de" },
	{ name = "*", is = "orphan", bg = "#c900c4" },
	{ name = "*", is = "exec", fg = "#4a2fd0" },
	{ name = "*/", fg = "#3264eb" },
	{ name = "*", fg = "#212121" },
]
