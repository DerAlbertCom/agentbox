# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Lupine color scheme
description: Lupine colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: lupine
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#212121,bg:-1,hl:#3264eb,fg+:#000000,bg+:#d0d0d0,hl+:#5482ff
      --color=info:#787878,prompt:#0c67de,pointer:#8a4ad7,marker:#4a2fd0
      --color=spinner:#8a4ad7,header:#026fde,border:#b9b9b9,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:lupine lupine
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Lupine color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
