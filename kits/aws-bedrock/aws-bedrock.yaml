# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: AWS Bedrock runtime
version: "1.1.0"
provides: [mti-ca-bedrock]
args:
  BEDROCK_REGION:
    default: eu-central-1
    enum: [eu-central-1]
    env: AWS_REGION
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: [bedrock-runtime.eu-central-1.amazonaws.com]
  - type: com.docker.sandbox/credential@1
    config:
      service: aws-bedrock
      phase: runtime
      apiKey:
        name: AWS_BEARER_TOKEN_BEDROCK
        proxyManaged: true
        inject:
          - domain: bedrock-runtime.eu-central-1.amazonaws.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        BAU uses Strands BedrockModel in eu-central-1 with a proxy-managed
        Bedrock API key, not an IAM access key. AWS_BEARER_TOKEN_BEDROCK is a
        placeholder; never run aws configure or save credentials. Only the
        Bedrock runtime is authenticated. SigV4 services (S3, STS, CloudWatch)
        require host-side access instead.
