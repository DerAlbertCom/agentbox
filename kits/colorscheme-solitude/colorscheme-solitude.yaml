# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Solitude color scheme
description: Solitude colors for the agents and terminal tools of the sandbox.
version: "1.0.0"
provides: [colorscheme]
args:
  COLORSCHEME_BAT_THEME:
    default: solitude
    env: BAT_THEME
  COLORSCHEME_FZF_OPTS:
    default: >-
      --color=fg:#cacccc,bg:-1,hl:#798186,fg+:#a5aeb4,bg+:#343d41,hl+:#5d6367
      --color=info:#808283,prompt:#707070,pointer:#aeaeae,marker:#9fa5a9
      --color=spinner:#aeaeae,header:#d9dbdc,border:#484b4c,gutter:-1
    env: FZF_DEFAULT_OPTS
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: sh /home/agent/.local/share/colorscheme/install.sh custom:solitude solitude
          user: "1000"
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The sandbox uses the Solitude color scheme: OpenCode, Claude Code,
        pi, bat, delta, fzf, lazygit and yazi are themed to match it.
